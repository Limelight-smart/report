    if(cs[1])cs[1].s='중단원('+u+')마다 개념 설명 → 유형 풀이 → 심화 풀이 순서로 진행하고, 그린라임라잇으로 틀린 유형을 다시 풀어 마무리했어요.';})();
  h+='<section><h2>주요 학습 내용</h2><ol class="cards">'+(D.cards||[]).map(function(c){return '<li><b>'+E(c.t)+'</b><span>'+E(c.s)+'</span></li>'}).join("")+'</ol></section>';
  (function(){var L={기본:[0,0],실력:[0,0],심화:[0,0]};(P.blocks||[]).forEach(function(b){(b.rows||[]).forEach(function(r){["기본","실력","심화"].forEach(function(k){var v=(r.lv||{})[k]||{},ok=(v.st||0)+(v.g||0),n=ok+(v.y||0)+(v.r||0)+(v.h||0);L[k][0]+=ok;L[k][1]+=n})})});
    var C={기본:"#9fdc5a",실력:"#ffb357",심화:"#ff7d7d"},ks=["기본","실력","심화"].filter(function(k){return L[k][1]}),pc=function(k){return Math.round(L[k][0]/L[k][1]*100)};
    var best=ks.slice().sort(function(a,b){return pc(b)-pc(a)})[0],low=ks.slice().sort(function(a,b){return pc(a)-pc(b)})[0];
    h+='<section class="lvc"><h2>'+E(D.label)+' 학습 분석</h2><h3 class="sb">난이도별 완성도</h3><div class="ch">'+

      ks.map(function(k){var p=pc(k);return '<div class="col"><strong style="bottom:calc('+p+'% + 6px)">'+p+'%</strong><div class="bx" style="height:'+p+'%;background:'+C[k]+'"></div><span>'+k+'</span></div>'}).join("")+'</div>'})();
  var bars=(D.sheets||[]).map(function(s){var p=s.n?Math.round(s.c/s.n*100):0,c=s.lv==="기본·실력"?"b":"h",nm=String(s.name||"").split(". ").slice(1).join(". ")||s.name;

  var T=P.tiles||{},un="";
  (P.blocks||[]).forEach(function(b){un+='<h3>'+E(b.mid)+'</h3>';(b.rows||[]).forEach(function(r){var rate=r.rate;
    un+='<div class="unit"><div class="uh"><div><em>'+E(r.code)+'</em><b>'+E(r.name)+'</b></div><div class="rt"><small>완성도</small><strong style="color:'+rcol(rate)+'">'+(rate==null?"–":rate+"%")+'</strong></div></div>'+

  app.innerHTML='<div class="wrap">'+h+'</div>'}
var m=/[?&]k=([A-Za-z0-9]{32,64})\b/.exec(location.search),k=m&&m[1];
